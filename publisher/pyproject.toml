[project]
name = "publisher"
version = "0.1.0"
description = "Publish Babylon shorts to YouTube, Instagram and TikTok, and collect metrics back."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.32",
    "structlog>=24.1",
]

[project.scripts]
publisher = "publisher.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
